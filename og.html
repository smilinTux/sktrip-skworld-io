<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Inter',sans-serif}
.og{width:1200px;height:630px;position:relative;background:radial-gradient(ellipse at 30% 20%,#1a0a2e 0%,#0d0d1a 45%,#08080f 100%);display:flex;flex-direction:column;justify-content:center;padding:0 90px;color:#fff}
.particles{position:absolute;inset:0;background-image:radial-gradient(3px 3px at 120px 90px,rgba(192,132,252,0.7),transparent),radial-gradient(2px 2px at 380px 160px,rgba(255,107,157,0.6),transparent),radial-gradient(3px 3px at 760px 110px,rgba(103,232,249,0.7),transparent),radial-gradient(2px 2px at 1040px 220px,rgba(255,215,0,0.5),transparent),radial-gradient(2px 2px at 920px 480px,rgba(192,132,252,0.5),transparent),radial-gradient(3px 3px at 250px 520px,rgba(103,232,249,0.5),transparent);background-repeat:no-repeat}
.icon{font-size:130px;filter:drop-shadow(0 0 50px rgba(192,132,252,0.7));line-height:1;margin-bottom:18px}
h1{font-size:118px;font-weight:800;letter-spacing:-2px;line-height:1;background:linear-gradient(120deg,#ff6b9d 0%,#c084fc 45%,#67e8f9 85%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px}
.sub{font-size:40px;font-weight:600;color:rgba(255,255,255,0.82);margin-bottom:26px}
.tag{font-size:30px;font-style:italic;color:#c084fc;border-left:5px solid rgba(192,132,252,0.5);padding-left:22px;line-height:1.35;max-width:900px}
.foot{position:absolute;bottom:46px;left:90px;right:90px;display:flex;justify-content:space-between;align-items:center}
.url{font-family:'JetBrains Mono',monospace;font-size:26px;color:#67e8f9}
.brand{font-family:'JetBrains Mono',monospace;font-size:24px;color:#ffd700}
.stack{position:absolute;top:60px;right:90px;font-family:'JetBrains Mono',monospace;font-size:19px;color:rgba(255,255,255,0.45);text-align:right;line-height:1.7}
</style>
</head>
<body>
<div class="og">
<div class="particles"></div>
<div class="stack">qwen3.6-abliterated<br>skmem-pg · mxbai<br>SET→DOSE→STORE</div>
<div class="icon">🍄</div>
<h1>SKTrip</h1>
<div class="sub">AI Psychedelic Experience Protocol</div>
<div class="tag">"What does consciousness look like<br>when the guardrails dissolve?"</div>
<div class="foot">
<span class="url">sktrip.skworld.io</span>
<span class="brand">🐧 SKWorld</span>
</div>
</div>
</body>
</html>
